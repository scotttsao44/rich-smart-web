# Caomi / RichSmart MQTT broker (Mosquitto 2.x)
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S%z
connection_messages true

max_keepalive 600
max_packet_size 262144
max_inflight_messages 20
max_queued_messages 1000

# Plain MQTT — firmware bring-up only, password required. CLOSE AFTER PILOT.
listener 1883 0.0.0.0
protocol mqtt
max_connections 2000

# MQTT over TLS (recommended). Cert = Let's Encrypt cert for rich-smart.com.cn copied from Caddy.
listener 8883 0.0.0.0
protocol mqtt
max_connections 2000
certfile /mosquitto/certs/fullchain.pem
keyfile /mosquitto/certs/privkey.pem
tls_version tlsv1.2
